name: Sync NIST FIPS & FIDO2+ Trust

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
    inputs:
      force_nist_refresh:
        description: "Ignore NIST certificate detail cache TTL and refetch all candidates"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-fips-fido
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run NIST CMVP + FIDO MDS3 sync
        env:
          FORCE_NIST_REFRESH: ${{ github.event.inputs.force_nist_refresh == 'true' && '1' || '0' }}
        run: |
          ARGS=(--summary-file "$GITHUB_STEP_SUMMARY")
          if [ "$FORCE_NIST_REFRESH" = "1" ]; then
            ARGS+=(--force-nist-refresh)
          fi
          python -m src.sync "${ARGS[@]}"

      - name: Validate exported manifests and certificates
        run: python -m src.validate

      - name: Commit and push updated trust artifacts
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certs pubkeys data README.md
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          MDS_NO=$(python -c "import json; print(json.load(open('data/fips-fido2-devices.json', encoding='utf-8')).get('mds_blob_no', 'unknown'))")
          DEV_COUNT=$(python -c "import json; print(json.load(open('data/fips-fido2-devices.json', encoding='utf-8')).get('device_count', 0))")
          git commit -m "chore(sync): update FIPS FIDO2+ trust data (MDS3 #${MDS_NO}, ${DEV_COUNT} models)"
          git push
